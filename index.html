<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Interactive dashboard of Viet Nam energy balances 2000–2060 (APERC Outlook, Reference vs Target scenarios): primary supply, power generation, final demand, transport, balance tables.">
<meta property="og:title" content="Viet Nam Energy Outlook 2060">
<meta property="og:description" content="Interactive energy balance dashboard for Viet Nam, 2000–2060, by Phung Quoc Huy.">
<meta property="og:type" content="website">
<title>Viet Nam Energy Outlook 2060</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --ground:#eef1f4; --card:#ffffff; --card-2:#f7f9fb; --line:#dfe4ea; --line-2:#eef1f4;
  --ink:#111a24; --ink-2:#4b5866; --ink-3:#7d8794;
  --rail:#0f1f33; --rail-ink:#dbe4ef; --rail-muted:#7f92a8; --rail-active:#1a3a5f;
  --accent:#184f95; --accent-2:#2a78d6; --focus:#eda100;
  --ref:#2a78d6; --tgt:#eb6834;
  --f-coal:#8a4b1f; --f-oil:#e34948; --f-gas:#4a3aa7; --f-hydro:#2a78d6; --f-solar:#eda100; --f-wind:#1baf7a; --f-bio:#008300; --f-new:#e87ba4; --f-elec:#eda100; --f-other:#8d949b;
  --radius:6px; --gap:14px;
  --font-body:"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-head:"IBM Plex Sans Condensed", "Arial Narrow", "IBM Plex Sans", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;letter-spacing:.005em}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
/* rail */
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{font-size:19px;font-weight:700;line-height:1.15;color:#fff}
.brand .sub{font-size:11.5px;color:var(--rail-muted);margin-top:6px;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;padding:14px 10px;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;color:var(--rail-ink);padding:9px 12px;border-radius:5px;font-weight:500;font-size:13.5px;width:100%}
.nav button .k{font-family:var(--font-head);font-size:11px;color:var(--rail-muted);width:16px;letter-spacing:.06em}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--rail-active);color:#fff}
.nav button.on .k{color:#9fc1ea}
.home{margin:auto 20px 0;font-size:12.5px;color:#9fc1ea;text-decoration:none;font-weight:500}.home:hover{color:#fff;text-decoration:underline}
.rail .foot{margin-top:6px;padding:16px 20px 0;font-size:11px;color:var(--rail-muted);line-height:1.5}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.controls{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label,.ctl .lbl{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--card-2)}
.seg button{padding:5px 11px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.ref{background:var(--ref)} .seg button.on.tgt{background:var(--tgt)}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.yearctl{display:flex;align-items:center;gap:10px;flex:1 1 100%;order:10;padding-top:2px}
.yearctl input[type=range]{flex:1;accent-color:var(--accent);min-width:140px}
.yearval{font-family:var(--font-head);font-size:20px;font-weight:700;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.milestones{display:flex;gap:4px}
.milestones button{font-size:11.5px;padding:3px 7px;border:1px solid var(--line);border-radius:4px;color:var(--ink-2);background:var(--card-2);font-variant-numeric:tabular-nums}
.milestones button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.content{padding:18px 22px 40px;display:flex;flex-direction:column;gap:var(--gap)}
.tab{display:none;flex-direction:column;gap:var(--gap)}
.tab.on{display:flex}
.tabhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tabhead h2{font-size:22px;font-weight:700}
.tabhead .note{font-size:12.5px;color:var(--ink-2);max-width:70ch}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--gap)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 11px;display:flex;flex-direction:column;gap:3px;min-height:92px}
.kpi .l{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;line-height:1.3}
.kpi .v{font-family:var(--font-head);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .v small{font-size:13px;color:var(--ink-2);font-weight:600;margin-left:3px;font-family:var(--font-body)}
.kpi .d{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.kpi .d b{font-weight:600}
.kpi .d b{color:var(--ink)}
.kpi .cmp{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .cmp .tag{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi .cmp .tag.ref{color:var(--ref)}.kpi .cmp .tag.tgt{color:var(--tgt)}
.kpi .cmp .n{font-family:var(--font-head);font-size:17px;font-weight:700;line-height:1.15}
/* cards */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px 12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card.c6{grid-column:span 6}.card.c4{grid-column:span 4}.card.c8{grid-column:span 8}.card.c12{grid-column:span 12}
.card h3{font-size:14.5px;font-weight:600;color:var(--ink)}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ic{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:3px 8px;background:var(--card-2);white-space:nowrap;flex-shrink:0}
.ic:hover{background:#e8edf2;color:var(--ink)}
.ic svg{width:12px;height:12px}
.ic.busy{opacity:.5;pointer-events:none}
.tabhead .ic{align-self:center}
.card .sub{font-size:12px;color:var(--ink-3);margin-top:-5px}
.plot{position:relative;height:290px}
.plot.tall{height:380px}.plot.short{height:230px}
.plots2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plots2>div{min-width:0}
.plots2 .plot{height:270px}
.plots2 .cap{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-align:center;margin-bottom:2px}
.plots2 .cap.ref{color:var(--ref)}.plots2 .cap.tgt{color:var(--tgt)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
/* tables */
.tblwrap{overflow-x:auto;max-height:560px;overflow-y:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line-2)}
th{background:var(--card-2);color:var(--ink-2);font-weight:600;font-size:11.5px;position:sticky;top:0;z-index:2}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
th:first-child{z-index:3;background:var(--card-2)}
tr.total td{font-weight:700;background:var(--card-2);border-top:1px solid var(--line)}
tr.total td:first-child{background:var(--card-2)}
tr.sub td:first-child{padding-left:22px;color:var(--ink-2)}
td.neg{color:#8a2a1a}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar select{padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:var(--card-2)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card-2);font-size:12.5px;font-weight:500}
.btn:hover{background:#e8edf2}
.tiny{font-size:11.5px;color:var(--ink-3)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:4px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* sankey */
.sankeywrap{height:460px;position:relative}
@media (max-width:1100px){.card.c4{grid-column:span 6}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;padding:14px 0 0}
  .nav{flex-direction:row;overflow-x:auto;padding:10px}
  .nav button{white-space:nowrap;width:auto}
  .rail .foot{display:none}
  .card.c6,.card.c4,.card.c8{grid-column:span 12}
  .plots2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media print{.rail,.controls{display:none}.app{grid-template-columns:1fr}.card{break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1 data-i="title">Viet Nam Energy Outlook 2060</h1>
      <div class="sub" data-i="subtitle">Bảng cân bằng năng lượng · 2000–2060</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <a class="home" href="https://phungquochuy.com/" target="_top">&larr; phungquochuy.com</a><div class="foot" id="foot"></div>
  </aside>
  <div class="main">
    <div class="controls">
      <div class="ctl"><span class="lbl" data-i="scenario">Kịch bản</span>
        <div class="seg" id="scenSeg">
          <button data-s="reference" class="on ref">Reference</button>
          <button data-s="target" class="tgt">Target</button>
        </div>
        <label class="chk"><input type="checkbox" id="cmp"><span data-i="compare">So sánh 2 kịch bản</span></label>
      </div>
      <div class="ctl yearctl"><span class="lbl" data-i="year">Năm</span>
        <input type="range" id="year" min="2000" max="2060" value="2030" step="1">
        <span class="yearval" id="yearval">2030</span>
        <div class="milestones" id="ms"></div>
      </div>
      <div class="ctl"><span class="lbl" data-i="unit">Đơn vị</span>
        <div class="seg" id="unitSeg"><button data-u="PJ" class="on">PJ</button><button data-u="Mtoe">Mtoe</button></div>
      </div>
      <div class="ctl"><span class="lbl">Lang</span>
        <div class="seg" id="langSeg"><button data-l="vi" class="on">VI</button><button data-l="en">EN</button></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

function grouped(ds, scen, G){ // -> {group: series}
  const src = DATA[ds][scen] || {}; const out = {};
  for (const g in G){ const s = zeros(); let any=false; for (const f of G[g]){ if (src[f]){ any=true; src[f].forEach((v,i)=>s[i]+=v);} } if (any && s.some(v=>Math.abs(v)>1e-6)) out[g]=s; }
  return out;
}

function share(part, whole){ return whole ? 100*part/whole : 0; }

const ORDER = ["coal","oil","gas","hydro","solar","wind","bio","newf","newf_d","elec","other","industry","transport","buildings","agri","nonenergy","otherdem","road","air","water","rail","pipeline","nonspec","ice_gasoline","ice_diesel","bev","phev","fcev","gas_vehicle","lpg","unspecified","residential","commercial_and_public_services","traditional_data_centres","ai_training","buildings_unspecified","ownuse","tdloss"];
const ordKeys = obj => Object.keys(obj).sort((a,b)=>{const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib);});
function stackedArea(id, obj, colors, labeler, unit, opt={}){
  const keys = ordKeys(obj).filter(k=>obj[k].some(v=>Math.abs(v)>1e-6));
  const scale = opt.gwh ? 1/1000 : (opt.noconv?1:1);
  const datasets = keys.map(k=>({label:labeler(k), data:obj[k].map(v=> (opt.abs?Math.abs(v):v) * scale * (opt.gwh||opt.noconv?1:(S.unit==="Mtoe"?1/MTOE:1))), backgroundColor:colors[k]||"#8d949b", borderColor:"#ffffff", borderWidth:1.2, fill:true, pointRadius:0, pointHoverRadius:4, pointHoverBackgroundColor:colors[k], tension:0, stack:"a"}));
  mk(id, {type:"line", data:{labels:YEARS.map(String), datasets}, options:{responsive:true, maintainAspectRatio:false, interaction:{mode:"index", intersect:false},

    scales:{x:axisX(), y:Object.assign(axisY(unit), opt.ymax?{suggestedMax:opt.ymax}:{})}}});
}

    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:"index", intersect:false}, plugins:{legend:{position:"bottom", labels:{usePointStyle:false, boxWidth:22, boxHeight:2}}, yearLine:{enabled:true}, histShade:{enabled:true}, tooltip:{usePointStyle:false, callbacks:{label:c=>` ${c.dataset.label}: ${fmtN(c.parsed.y)} ${unit}`}}},
      scales:{x:Object.assign(axisX(),{stacked:false}), y:Object.assign(axisY(unit),{stacked:false, beginAtZero:true})}}});
}

  mk(id, {type:"bar", data:{labels, datasets:series.map(s=>({label:s.label, data:s.data, backgroundColor:s.color, borderRadius:{topRight:4,bottomRight:4}, borderSkipped:"left", barPercentage:0.75, categoryPercentage:0.7}))},
    options:{indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{legend:{display:series.length>1, position:"bottom"}, tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmtN(c.parsed.x)} ${unit}`}}},
      scales:{x:{grid:gridStyle, border:{display:false}, beginAtZero:true, ticks:{callback:v=>fmtN(v,0)}, title:{display:true,text:unit,color:"#7d8794",font:{size:10.5}}}, y:{grid:{display:false}, border:{display:false}, ticks:{autoSkip:false, font:{size:11}}}}}});

function mixBars(id, rows, colors, labeler){ // rows: [{label, shares:{k:pct}}]
  const keys = [...new Set(rows.flatMap(r=>Object.keys(r.shares)))];
  const datasets = keys.map(k=>({label:labeler(k), data:rows.map(r=>r.shares[k]||0), backgroundColor:colors[k]||"#8d949b", borderColor:"#fff", borderWidth:1, barPercentage:0.7, categoryPercentage:0.85}));
  mk(id, {type:"bar", data:{labels:rows.map(r=>r.label), datasets}, options:{indexAxis:"y", responsive:true, maintainAspectRatio:false, plugins:{legend:{position:"bottom"}, tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmtP(c.parsed.x)}`}}},
    scales:{x:{stacked:true, min:0, max:100, grid:gridStyle, border:{display:false}, ticks:{callback:v=>v+"%"}}, y:{stacked:true, grid:{display:false}, border:{display:false}, ticks:{font:{size:11.5, weight:"600"}}}}}});

/* compare-aware stacked area: renders one or two panels inside container */
function areaPanel(containerId, baseId, dsFn, colors, labeler, unit, opt={}){
  const box = document.getElementById(containerId); if(!box) return;
  const scens = S.cmp ? ["reference","target"] : [S.scen];
  let ymax = 0;
  if (S.cmp){ for (const sc of scens){ const o=dsFn(sc); const t=totalOf(Object.fromEntries(Object.entries(o).map(([k,v])=>[k,v.map(x=>opt.abs?Math.abs(x):x)]))); ymax=Math.max(ymax,...t); } ymax = ymax*(opt.gwh?1/1000:(S.unit==="Mtoe"?1/MTOE:1)); const mag=Math.pow(10,Math.floor(Math.log10(ymax||1))); const st=mag/2; ymax=Math.ceil(ymax/st)*st; }
  box.className = S.cmp ? "plots2" : "";
  box.innerHTML = scens.map(sc=>`<div>${S.cmp?`<div class="cap ${sc==="reference"?"ref":"tgt"}">${T()[sc]}</div>`:""}<div class="plot"><canvas id="${baseId}_${sc}"></canvas></div></div>`).join("");
  for (const sc of scens){ destroy(`${baseId}_${sc}`); stackedArea(`${baseId}_${sc}`, dsFn(sc), colors, labeler, unit, Object.assign({}, opt, S.cmp?{ymax}:{})); }
}
function clearPanel(baseId){ for (const sc of ["reference","target"]) destroy(`${baseId}_${sc}`); }

/* ===================== KPI ===================== */
function kpi(labelKey, valFn, fmt, opt={}){
  const t=T(); const y=S.year, base = y>2022?2022:2000;
  const cell = sc => { const v=valFn(sc,y), b=valFn(sc,base); const d = opt.pct ? v-b : (b?100*(v-b)/b:null);
    const dtxt = d==null?"": (opt.pct? `<b>${d>=0?"+":""}${fmtN(d,1)} pp</b> ${t.vs} ${base}` : `<b>${d>=0?"+":""}${fmtN(d,1)}%</b> ${t.vs} ${base}`);
    return {v:fmt(v), d:dtxt, cls:d==null?"":(d>=0?"up":"down")}; };
  if (!S.cmp){ const c=cell(S.scen); return `<div class="kpi"><div class="l">${t.kpi[labelKey]}</div><div class="v">${c.v}${opt.unit?`<small>${opt.unit}</small>`:""}</div><div class="d ${c.cls}">${c.d}</div></div>`; }
  const rv=valFn("reference",y), gv=valFn("target",y); const dd = opt.pct ? gv-rv : (rv?100*(gv-rv)/rv:null);
  const dtxt = dd==null?"":(opt.pct?`<b>${dd>=0?"+":""}${fmtN(dd,1)} pp</b>`:`<b>${dd>=0?"+":""}${fmtN(dd,1)}%</b>`)+` Target ${t.vs} Reference`;
  return `<div class="kpi"><div class="l">${t.kpi[labelKey]}${opt.unit?` <span style="text-transform:none;letter-spacing:0">(${opt.unit})</span>`:""}</div><div class="cmp"><span class="tag ref">Ref</span><span class="n">${fmt(rv)}</span><span class="tag tgt">Tgt</span><span class="n">${fmt(gv)}</span></div><div class="d ${dd==null?"":(dd>=0?"up":"down")}">${dtxt}</div></div>`;
}
/* metric functions */

  tpes:(sc,y)=>at(raw("tpes",sc),y),
  tfc:(sc,y)=>at(raw("tfc_fuel",sc),y),

  fossil:(sc,y)=>{const g=grouped("tpes",sc,SUPPLY_G); const f=(g.coal?g.coal[yi(y)]:0)+(g.oil?g.oil[yi(y)]:0)+(g.gas?g.gas[yi(y)]:0); return share(f, at(raw("tpes",sc),y));},
  reshare:(sc,y)=>{const g=grouped("elec_gen",sc,GEN_G); const r=["hydro","solar","wind","bio"].reduce((s,k)=>s+(g[k]?g[k][yi(y)]:0),0); return share(r, at(raw("elec_gen",sc),y));},
  vregen:(sc,y)=>{const g=grouped("elec_gen",sc,GEN_G); const r=["solar","wind"].reduce((s,k)=>s+(g[k]?g[k][yi(y)]:0),0); return share(r, at(raw("elec_gen",sc),y));},
  coalgen:(sc,y)=>{const g=grouped("elec_gen",sc,GEN_G); return share(g.coal?g.coal[yi(y)]:0, at(raw("elec_gen",sc),y));},
  gasgen:(sc,y)=>{const g=grouped("elec_gen",sc,GEN_G); return share(g.gas?g.gas[yi(y)]:0, at(raw("elec_gen",sc),y));},
  elecshare:(sc,y)=>{const r=raw("tfc_fuel",sc); return share(r.elec?r.elec[yi(y)]:0, at(r,y));},
  importdep:(sc,y)=>{const i=at(raw("imports",sc),y), e=at(raw("exports",sc),y); return share(i+e, at(raw("tpes",sc),y));},
  prod:(sc,y)=>at(raw("production",sc),y),
  netimp:(sc,y)=>at(raw("imports",sc),y)+at(raw("exports",sc),y),
  selfsuff:(sc,y)=>share(at(raw("production",sc),y), at(raw("tpes",sc),y)),

/* ===================== Sankey ===================== */
function buildSankey(sc, y){
  const t=T(), i=yi(y), F=t.fuel, flows=[];
  const add=(from,to,v)=>{ if (v>0.5) flows.push({from,to,flow:v}); };
  const prod=grouped("production",sc,SUPPLY_G), imp=grouped("imports",sc,SUPPLY_G), tpes=grouped("tpes",sc,SUPPLY_G);
  const fuelNode = g => F[g];
  const PROD = t.bal.production, IMP = t.bal.imports;
  for (const g in tpes){ const p=(prod[g]?prod[g][i]:0), m=(imp[g]?imp[g][i]:0); add(PROD, fuelNode(g), Math.max(0,p)); add(IMP, fuelNode(g), Math.max(0,m)); }
  // fuel -> power plants (inputs are negative)
  const pin=grouped("power_input",sc,GEN_G); const POWER = t.bal.transformation.split(" (")[0];
  const PP = S.lang==="vi"?"Nhà máy điện":"Power plants";
  let ppIn=0; for (const g in pin){ if (g==="other"&&pin[g][i]>0) continue; const v=Math.abs(Math.min(0,pin[g][i])); const gg = g==="newf_d"?"newf":g; add(fuelNode(gg), PP, v); ppIn+=v; }
  // electricity generated -> sectors ; losses
  const SECT = {industry:t.sector.industry, transport:t.sector.transport, buildings:t.sector.buildings, agri:t.sector.agri, nonenergy:t.sector.nonenergy, otherdem:t.sector.otherdem};
  const ELEC = F.elec, LOSS = t.kpi.losses, EXP = t.bal.exports;
  const elecOut = pin.other && pin.other[i]>0 ? pin.other[i] : 0;
  add(PP, ELEC, elecOut);
  const lossElec = Math.abs(at(raw("losses",sc),y));
  add(ELEC, LOSS, lossElec);
  if (tpes.other && tpes.other[i]>0) add(fuelNode("other"), ELEC, tpes.other[i]);
  for (const s in SECT){ const src=DATA.tfc_sector_fuel[s][sc]||{}; const g={}; for (const dg in DEMAND_G){ let v=0; for (const f of DEMAND_G[dg]) if (src[f]) v+=src[f][i]; if (v>0) g[dg]=v; }
    for (const dg in g){ if (dg==="elec") add(ELEC, SECT[s], g[dg]); else { const sg = dg==="newf_d"?"newf":dg; add(fuelNode(sg), SECT[s], g[dg]); } } }
  // exports
  const exp=grouped("exports",sc,SUPPLY_G); for (const g in exp){ add(fuelNode(g), EXP, Math.abs(exp[g][i])); }
  // other transformation (refinery, hydrogen) approximated: fuel-> "Other transformation" not drawn to keep readable
  const nodeColor = name => { for (const g in F) if (F[g]===name && FCOL[g]) return FCOL[g]; if (name===PROD) return "#184f95"; if (name===IMP) return "#7d8794"; if (name===PP) return "#111a24"; if (name===LOSS) return "#b0b7be"; if (name===EXP) return "#b0b7be"; for (const s in SECT) if (SECT[s]===name) return SCOL[s]; return "#8d949b"; };
  const colGroups = {}; colGroups[PROD]=0; colGroups[IMP]=0; for (const g in F) colGroups[F[g]]=1; colGroups[PP]=2; colGroups[ELEC]=3; colGroups[LOSS]=4; colGroups[EXP]=4; for (const s in SECT) colGroups[SECT[s]]=4;
  return {flows, nodeColor, colGroups};
}
function renderSankey(){
  const el=document.getElementById("sankey"); if(!el) return;
  const {flows,nodeColor,colGroups}=buildSankey(S.scen,S.year);
  const priority={}; Object.keys(colGroups).forEach((k,n)=>priority[k]=n);
  mk("sankey",{type:"sankey", data:{datasets:[{data:flows, colorFrom:c=>nodeColor(c.dataset.data[c.dataIndex].from), colorTo:c=>nodeColor(c.dataset.data[c.dataIndex].to), colorMode:"gradient", priority:priority, alpha:0.38, nodeWidth:14, borderWidth:0, size:"max", font:{size:11, weight:"600"}, color:"#111a24"}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{tooltip:{callbacks:{label:c=>{const d=c.dataset.data[c.dataIndex]; return ` ${d.from} → ${d.to}: ${fmtN(conv(d.flow))} ${unitLbl()}`;}}}}}});

let DL = undefined; // downloads capability (artifact viewer) — resolved lazily
async function getDownloads(){ if (DL!==undefined) return DL; try{ DL = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("downloads") : null; }catch(e){ DL=null; } return DL; }
async function saveFile(filename, blob){
  const t=T(); const inArtifact = !!(window.claude && typeof window.claude.use==="function");
  if (inArtifact){ const d=await getDownloads(); if (!d){ toast("Download unavailable"); return false; }
    try{ await d.save({filename, data:blob}); toast(t.ui.saved+": "+filename); return true; }
    catch(e){ if (e && e.code==="declined") toast(t.ui.declined); else toast((e&&e.message)||"Download failed"); return false; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast(t.ui.saved+": "+filename); return true;
}
function slug(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,""); }
function renderOffscreen(chart, w, h){
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const cfg=chart.config; const opts=Object.assign({}, cfg.options, {responsive:false, maintainAspectRatio:false, devicePixelRatio:2, animation:false});
  const off=new Chart(c.getContext("2d"), {type:cfg.type, data:cfg.data, options:opts});

}
function wrapText(ctx, text, maxW){ const words=text.split(" "), lines=[]; let cur=""; for (const w of words){ const tst=cur?cur+" "+w:w; if (ctx.measureText(tst).width>maxW && cur){ lines.push(cur); cur=w; } else cur=tst; } if (cur) lines.push(cur); return lines; }
async function exportCard(cardEl, btn){
  if (!cardEl) return false; const t=T();
  const cvs=[...cardEl.querySelectorAll("canvas")].filter(c=>charts[c.id]); if (!cvs.length) return false;
  if (btn) btn.classList.add("busy");
  try{
    const title=(cardEl.querySelector("h3")||{}).textContent||"Chart"; const sub=(cardEl.querySelector(".sub")||{}).textContent||"";
    const caps=[...cardEl.querySelectorAll(".cap")].map(c=>c.textContent);
    const isSankey = cardEl.dataset.cid==="sankey";
    const n=cvs.length, PW = n>1?620:(isSankey?1200:960), PH = isSankey?520:(cvs[0].parentElement.classList.contains("tall")?460:400), GAP=24, PAD=32;
    const W=PAD*2+PW*n+GAP*(n-1);
    const font=Chart.defaults.font.family;
    const meas=document.createElement("canvas").getContext("2d"); meas.font="400 13px "+font; const subLines=sub?wrapText(meas, sub, W-PAD*2):[];
    const headH = 26 + (subLines.length?subLines.length*18+4:0) + (caps.length?22:0) + 16;
    const footH=34; const H=PAD+headH+PH+footH;
    const out=document.createElement("canvas"); out.width=W*2; out.height=H*2; const ctx=out.getContext("2d"); ctx.scale(2,2);
    ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#111a24"; ctx.font="700 19px "+font; ctx.textBaseline="top"; ctx.fillText(title, PAD, PAD-6);
    let y=PAD+22; ctx.fillStyle="#5c6670"; ctx.font="400 13px "+font; for (const l of subLines){ ctx.fillText(l, PAD, y); y+=18; }
    if (subLines.length) y+=4;
    if (caps.length){ ctx.font="600 12px "+font; cvs.forEach((c,i)=>{ const x=PAD+i*(PW+GAP); ctx.fillStyle=(caps[i]||"").toUpperCase().includes("TARGET")?TGT:REF; ctx.textAlign="center"; ctx.fillText((caps[i]||"").toUpperCase(), x+PW/2, y); }); ctx.textAlign="left"; y+=22; }
    y+=16-4;
    const offs=[];
    cvs.forEach((c,i)=>{ const o=renderOffscreen(charts[c.id], PW, PH); offs.push(o); ctx.drawImage(o.canvas, PAD+i*(PW+GAP), y, PW, PH); });
    offs.forEach(o=>o.destroy());
    const fy=H-footH+8; ctx.strokeStyle="#dfe4ea"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(PAD, fy-6); ctx.lineTo(W-PAD, fy-6); ctx.stroke();
    ctx.fillStyle="#7d8794"; ctx.font="400 11px "+font;
    const ctxLine = `${S.cmp?t.reference+" vs "+t.target:t[S.scen]} · ${t.year} ${S.year} · ${S.unit}${isSankey?"":""}`;
    ctx.fillText(ctxLine, PAD, fy); ctx.textAlign="right"; ctx.fillText(t.ui.source, W-PAD, fy); ctx.textAlign="left";
    const blob=await new Promise(r=>out.toBlob(r,"image/png"));
    const fname=`${slug(title)}_${S.cmp?"Ref_vs_Target":S.scen}_${S.year}.png`;
    return await saveFile(fname, blob);
  } finally { if (btn) btn.classList.remove("busy"); }
}

  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{TAB=b.dataset.t; document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b)); document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.id==="tab_"+TAB)); render();});
  document.querySelectorAll("#ms button").forEach(b=>b.onclick=()=>{S.year=+b.dataset.y; document.getElementById("year").value=S.year; syncYear(); render();});
  document.querySelectorAll("[data-export]").forEach(b=>b.onclick=()=>exportCard(b.closest(".card"), b));
  document.querySelectorAll("[data-exportall]").forEach(b=>b.onclick=()=>exportAll(b));
  document.getElementById("dsSel").onchange=e=>{EX.ds=e.target.value; renderExplorer();};
  document.querySelectorAll("#stepSeg button").forEach(b=>b.onclick=()=>{EX.step=+b.dataset.st; document.querySelectorAll("#stepSeg button").forEach(x=>x.classList.toggle("on",x===b)); renderExplorer();});
  document.getElementById("copyBtn").onclick=()=>{ navigator.clipboard.writeText(explorerCSV()).then(()=>toast(t.ui.copied)); };
  document.getElementById("dlBtn").onclick=()=>saveFile(`vietnam_${EX.ds}_${S.cmp?"both":S.scen}.csv`, new Blob(["﻿"+explorerCSV()],{type:"text/csv"}));
}
function syncYear(){ document.getElementById("yearval").textContent=S.year; document.querySelectorAll("#ms button").forEach(b=>b.classList.toggle("on",+b.dataset.y===S.year)); }

/* ===================== Render ===================== */
function render(){
  const t=T(), F=t.fuel, U=unitLbl(), y=S.year;
  const fl = k => F[k]||k;
  if (TAB==="overview"){
    document.getElementById("kpi_overview").innerHTML = [kpi("tpes",M.tpes,fmtE,{unit:U}),kpi("tfc",M.tfc,fmtE,{unit:U}),kpi("gen",M.gen,v=>fmtN(v,0),{unit:"TWh"}),kpi("fossil",M.fossil,fmtP,{pct:true}),kpi("reshare",M.reshare,fmtP,{pct:true}),kpi("elecshare",M.elecshare,fmtP,{pct:true})].join("");
    areaPanel("tpes_fuel","tpes_fuel",sc=>grouped("tpes",sc,SUPPLY_G),FCOL,fl,U);
    areaPanel("tfc_sector","tfc_sector",sc=>raw("tfc_sector",sc),SCOL,k=>t.sector[k]||k,U);
    lines("cmp_tpes",[{label:t.reference,data:totalOf(raw("tpes","reference")).map(conv),color:REF},{label:t.target,data:totalOf(raw("tpes","target")).map(conv),color:TGT}],U);
    lines("cmp_tfc",[{label:t.reference,data:totalOf(raw("tfc_fuel","reference")).map(conv),color:REF},{label:t.target,data:totalOf(raw("tfc_fuel","target")).map(conv),color:TGT}],U);
    renderSankey(); document.getElementById("sankeycap").textContent = `${t[S.scen]} · ${y} · ${U}`;
  }
  if (TAB==="supply"){
    document.getElementById("kpi_supply").innerHTML=[kpi("prod",M.prod,fmtE,{unit:U}),kpi("netimp",M.netimp,fmtE,{unit:U}),kpi("selfsuff",M.selfsuff,fmtP,{pct:true}),kpi("importdep",M.importdep,fmtP,{pct:true}),kpi("coalshare",M.coalshare,fmtP,{pct:true}),kpi("fossil",M.fossil,fmtP,{pct:true})].join("");
    areaPanel("prod_fuel","prod_fuel",sc=>grouped("production",sc,SUPPLY_G),FCOL,fl,U);
    areaPanel("imp_fuel","imp_fuel",sc=>grouped("imports",sc,SUPPLY_G),FCOL,fl,U);
    areaPanel("exp_fuel","exp_fuel",sc=>grouped("exports",sc,SUPPLY_G),FCOL,fl,U,{abs:true});
    const rows=[]; for (const sc of (S.cmp?["reference","target"]:[S.scen])) for (const yy of [2022,2030,2040,2050,2060]){ const g=grouped("tpes",sc,SUPPLY_G); const tot=at(raw("tpes",sc),yy); const shares={}; for (const k in g) shares[k]=share(Math.max(0,g[k][yi(yy)]),tot); rows.push({label:(S.cmp?(sc==="reference"?"Ref ":"Tgt "):"")+yy, shares}); }
    mixBars("mix_years",rows,FCOL,fl);
    const cg=sc=>grouped("tpes",sc,SUPPLY_G).coal.map(conv);
    lines("coal_peak",[{label:t.reference,data:cg("reference"),color:REF},{label:t.target,data:cg("target"),color:TGT}],U);
  }
  if (TAB==="power"){
    document.getElementById("kpi_power").innerHTML=[kpi("gen",M.gen,v=>fmtN(v,0),{unit:"TWh"}),kpi("reshare",M.reshare,fmtP,{pct:true}),kpi("vregen",M.vregen,fmtP,{pct:true}),kpi("coalgen",M.coalgen,fmtP,{pct:true}),kpi("gasgen",M.gasgen,fmtP,{pct:true}),kpi("losses",M.losses,fmtE,{unit:U})].join("");
    areaPanel("gen_src","gen_src",sc=>grouped("elec_gen",sc,GEN_G),FCOL,fl,"TWh",{gwh:true});
    const rows=[]; for (const sc of (S.cmp?["reference","target"]:[S.scen])) for (const yy of [2022,2030,2040,2050,2060]){ const g=grouped("elec_gen",sc,GEN_G); const tot=at(raw("elec_gen",sc),yy); const shares={}; for (const k in g) shares[k]=share(g[k][yi(yy)],tot); rows.push({label:(S.cmp?(sc==="reference"?"Ref ":"Tgt "):"")+yy, shares}); }
    mixBars("gen_mix",rows,FCOL,fl);
    lines("gen_cmp",[{label:t.reference,data:totalOf(raw("elec_gen","reference")).map(v=>v/1000),color:REF},{label:t.target,data:totalOf(raw("elec_gen","target")).map(v=>v/1000),color:TGT}],"TWh");
    areaPanel("pp_input","pp_input",sc=>{const g=grouped("power_input",sc,GEN_G); const o={}; for (const k in g){ if (k==="other") continue; o[k]=g[k].map(v=>Math.abs(Math.min(0,v))); } return o;},FCOL,fl,U);
    areaPanel("losses","losses",sc=>raw("losses",sc),LCOL,k=>t.loss[k]||k,U,{abs:true});
  }
  if (TAB==="demand"){
    document.getElementById("kpi_demand").innerHTML=[kpi("tfc",M.tfc,fmtE,{unit:U}),kpi("industry",M.sector("industry"),fmtE,{unit:U}),kpi("buildings",M.sector("buildings"),fmtE,{unit:U}),kpi("agri",M.sector("agri"),fmtE,{unit:U}),kpi("nonenergy",M.sector("nonenergy"),fmtE,{unit:U}),kpi("elecshare",M.elecshare,fmtP,{pct:true})].join("");
    areaPanel("tfc_fuel","tfc_fuel",sc=>grouped("tfc_fuel",sc,DEMAND_G),FCOL,fl,U);
    const sl=[]; for (const k of ["industry","transport","buildings","agri","nonenergy"]){ const r=raw("tfc_sector","reference")[k], g=raw("tfc_sector","target")[k]; if(!r) continue; sl.push({label:t.sector[k]+" · Ref",data:r.map(conv),color:SCOL[k]}); sl.push({label:t.sector[k]+" · Tgt",data:g.map(conv),color:SCOL[k],dash:[5,4]}); }
    lines("sector_cmp",sl,U);
    const ikeys=Object.keys(raw("industry","reference")).filter(k=>Math.abs(raw("industry","reference")[k][yi(y)])+Math.abs((raw("industry","target")[k]||zeros())[yi(y)])>0.5).sort((a,b)=>raw("industry",S.scen)[b][yi(y)]-raw("industry",S.scen)[a][yi(y)]);
    const iser = S.cmp ? [{label:t.reference,data:ikeys.map(k=>conv(raw("industry","reference")[k][yi(y)])),color:REF},{label:t.target,data:ikeys.map(k=>conv(raw("industry","target")[k][yi(y)])),color:TGT}] : [{label:t[S.scen],data:ikeys.map(k=>conv(raw("industry",S.scen)[k][yi(y)])),color:S.scen==="reference"?REF:TGT}];
    hbarGrouped("ind_sub",ikeys.map(k=>t.ind[k]||k),iser,U); document.getElementById("indyear").textContent=y;
    areaPanel("ind_fuel","ind_fuel",sc=>grouped("industry_fuel",sc,DEMAND_G),FCOL,fl,U);
    areaPanel("bld_sub","bld_sub",sc=>{const r=raw("other_sector",sc); const o={}; for (const k of ["residential","commercial_and_public_services","traditional_data_centres","ai_training","buildings_unspecified"]) if (r[k]) o[k]=r[k]; return o;},BCOL,k=>t.bld[k]||k,U);
    areaPanel("bld_fuel","bld_fuel",sc=>grouped("buildings_fuel",sc,DEMAND_G),FCOL,fl,U);
  }
  if (TAB==="transport"){
    document.getElementById("kpi_transport").innerHTML=[kpi("transport",M.transport,fmtE,{unit:U}),kpi("roadshare",M.roadshare,fmtP,{pct:true}),kpi("roadoil",M.roadoil,fmtP,{pct:true}),kpi("roadelec",M.roadelec,fmtP,{pct:true})].join("");
    areaPanel("tr_mode","tr_mode",sc=>raw("transport_mode",sc),MCOL,k=>t.mode[k]||k,U);
    areaPanel("road_tech","road_tech",sc=>{const r=raw("road_tech",sc); const o={}; for (const k of ["ice_gasoline","ice_diesel","bev","phev","fcev","gas_vehicle","lpg","unspecified"]) if (r[k]) o[k]=r[k]; return o;},TCOL,k=>t.tech[k]||k,U);
    const vkeys=Object.keys(raw("road_vehicle","reference")).filter(k=>k!=="road_unspecified"||y<=2022).filter(k=>Math.abs(raw("road_vehicle","reference")[k][yi(y)])+Math.abs((raw("road_vehicle","target")[k]||zeros())[yi(y)])>0.5).sort((a,b)=>raw("road_vehicle",S.scen)[b][yi(y)]-raw("road_vehicle",S.scen)[a][yi(y)]);
    const vser = S.cmp ? [{label:t.reference,data:vkeys.map(k=>conv(raw("road_vehicle","reference")[k][yi(y)])),color:REF},{label:t.target,data:vkeys.map(k=>conv(raw("road_vehicle","target")[k][yi(y)])),color:TGT}] : [{label:t[S.scen],data:vkeys.map(k=>conv(raw("road_vehicle",S.scen)[k][yi(y)])),color:S.scen==="reference"?REF:TGT}];
    hbarGrouped("road_veh",vkeys.map(k=>t.veh[k]||k),vser,U); document.getElementById("vehyear").textContent=y;
    areaPanel("tr_fuel","tr_fuel",sc=>grouped("transport_fuel",sc,DEMAND_G),FCOL,fl,U);
    const rd=sc=>totalOf(raw("road_fuel",sc)).map(conv);
    const rl=[{label:t.mode.road+" · "+t.reference,data:rd("reference"),color:REF},{label:t.mode.road+" · "+t.target,data:rd("target"),color:TGT}];
    for (const k of ["elec","hydrogen"]){ const r=raw("road_fuel","reference")[k], g=raw("road_fuel","target")[k]; if(r) rl.push({label:fl(k)+" · Ref",data:r.map(conv),color:k==="elec"?"#eda100":"#e87ba4"}); if(g) rl.push({label:fl(k)+" · Tgt",data:g.map(conv),color:k==="elec"?"#eda100":"#e87ba4",dash:[5,4]}); }
    lines("road_cmp",rl,U);
  }
  if (TAB==="balance"){ renderBalance(); renderExplorer(); }
}

/* ===================== Events ===================== */
document.querySelectorAll("#scenSeg button").forEach(b=>b.onclick=()=>{S.scen=b.dataset.s; document.querySelectorAll("#scenSeg button").forEach(x=>x.classList.toggle("on",x===b)); render();});
document.getElementById("cmp").onchange=e=>{S.cmp=e.target.checked; render();};
document.getElementById("year").oninput=e=>{S.year=+e.target.value; syncYear(); render();};
document.querySelectorAll("#unitSeg button").forEach(b=>b.onclick=()=>{S.unit=b.dataset.u; document.querySelectorAll("#unitSeg button").forEach(x=>x.classList.toggle("on",x===b)); render();});
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l; document.querySelectorAll("#langSeg button").forEach(x=>x.classList.toggle("on",x===b)); layout(); render();});
document.addEventListener("keydown",e=>{ if (e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return; if (e.key==="ArrowLeft"||e.key==="ArrowRight"){ S.year=Math.min(2060,Math.max(2000,S.year+(e.key==="ArrowRight"?1:-1))); document.getElementById("year").value=S.year; syncYear(); render(); } });
try{ const saved=JSON.parse(localStorage.getItem("vn_energy_dash")||"{}"); Object.assign(S,{lang:saved.lang||S.lang, unit:saved.unit||S.unit}); }catch(e){}
window.addEventListener("beforeunload",()=>{ try{ localStorage.setItem("vn_energy_dash",JSON.stringify({lang:S.lang,unit:S.unit})); }catch(e){} });
document.querySelectorAll("#langSeg button").forEach(x=>x.classList.toggle("on",x.dataset.l===S.lang));
document.querySelectorAll("#unitSeg button").forEach(x=>x.classList.toggle("on",x.dataset.u===S.unit));
layout(); syncYear(); render();
</script>

</body>
</html>
